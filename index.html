<!DOCTYPE html>
<html lang="en" data-view="school">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Give AI a clear assignment | AI 101</title>
  <meta name="description" content="A beginner-friendly presentation on using AI tools like Claude, explained with school and company metaphors. Available in English and Korean." />
  <!-- Inline icon so the browser never requests a missing /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <!-- Relative paths keep this working under a GitHub Pages subpath (/repo-name/) -->
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/content.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app" data-t="skip">Skip to presentation</a>

  <!-- Controls: two two-position sliders. Each is a radio group, so it works
       with Tab + arrow keys and screen readers announce "1 of 2, selected". -->
  <header class="controls" aria-labelledby="controls-title">
    <h2 id="controls-title" class="sr-only" data-t="controlsTitle">Presentation settings</h2>
    <div class="controls__inner">

      <fieldset class="toggle">
        <legend class="toggle__legend" data-t="viewLegend">Comparison</legend>
        <div class="toggle__track" data-pos="0">
          <input type="radio" id="view-school" name="view" value="school" checked />
          <label for="view-school"><span class="toggle__check" aria-hidden="true">✓</span><span data-t="viewSchool">School</span></label>
          <input type="radio" id="view-company" name="view" value="company" />
          <label for="view-company"><span class="toggle__check" aria-hidden="true">✓</span><span data-t="viewCompany">Company</span></label>
          <span class="toggle__thumb" aria-hidden="true"></span>
        </div>
      </fieldset>

      <fieldset class="toggle">
        <legend class="toggle__legend" data-t="langLegend">Language</legend>
        <div class="toggle__track" data-pos="0">
          <input type="radio" id="lang-en" name="lang" value="en" checked />
          <label for="lang-en" lang="en"><span class="toggle__check" aria-hidden="true">✓</span>English</label>
          <input type="radio" id="lang-ko" name="lang" value="ko" />
          <label for="lang-ko" lang="ko"><span class="toggle__check" aria-hidden="true">✓</span>한국어</label>
          <span class="toggle__thumb" aria-hidden="true"></span>
        </div>
      </fieldset>

    </div>

    <!-- Section menu (filled in by js/nav.js): a row of links on larger
         screens, a dropdown on phones. The underline slides to the section
         you're reading. -->
    <nav class="sectionnav" id="sectionnav" aria-label="Sections">
      <div class="sectionnav__track">
        <ol class="sectionnav__list"></ol>
        <span class="sectionnav__indicator" aria-hidden="true"></span>
      </div>
      <div class="sectionnav__compact">
        <button class="sectionnav__button" type="button" aria-expanded="false" aria-controls="section-menu">
          <span class="sr-only"><span data-n="contents">Go to section</span>:</span>
          <span class="sectionnav__count">01</span>
          <span class="sectionnav__name">Start here</span>
          <svg class="sectionnav__chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="section-menu" id="section-menu" hidden>
          <ol></ol>
        </div>
      </div>
    </nav>

  </header>

  <!-- Announces the new version to screen readers after a change -->
  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

  <!-- The presentation is drawn here by js/main.js from js/content.js -->
  <main id="app" tabindex="-1">
    <noscript>
      <p class="noscript">This presentation needs JavaScript to show its content. · 이 발표 자료를 보려면 JavaScript가 필요합니다.</p>
    </noscript>
  </main>

  <footer class="footer">
    <p data-t="footer">A learning presentation. Not affiliated with Anthropic or OpenAI.</p>
  </footer>
</body>
</html>
