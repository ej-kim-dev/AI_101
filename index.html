<!DOCTYPE html>
<html lang="en" data-view="school">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI-101</title>
  <meta name="description" content="A simple guide to using AI tools like Claude, for the classroom. Work with AI like you work with a teacher. In English and Korean." />

  <!-- Link preview card (Open Graph). Apps like KakaoTalk, Slack, iMessage and
       Facebook read these tags when someone shares the link. The image address
       must be complete (https://…), so update it if the repository is renamed. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AI-101" />
  <meta property="og:title" content="AI-101 · Work with AI like you work with a teacher" />
  <meta property="og:description" content="A simple guide to using AI tools like Claude, for the classroom. In English and Korean." />
  <meta property="og:url" content="https://ej-kim-dev.github.io/AI_101/" />
  <meta property="og:image" content="https://ej-kim-dev.github.io/AI_101/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AI-101: Work with AI like you work with a teacher." />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ko_KR" />
  <!-- X (Twitter) uses its own tag to show the large image -->
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Tab icon: a white spark (an eight-ray starburst drawn for AI-101) on black.
       It is written inline, so the browser never requests a missing /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M18.10 16.00L16.00 3.80L13.90 16.00ZM17.20 17.20L21.80 10.20L14.80 14.80ZM16.00 18.10L28.20 16.00L16.00 13.90ZM14.80 17.20L21.80 21.80L17.20 14.80ZM13.90 16.00L16.00 28.20L18.10 16.00ZM14.80 14.80L10.20 21.80L17.20 17.20ZM16.00 13.90L3.80 16.00L16.00 18.10ZM17.20 14.80L10.20 10.20L14.80 17.20Z' fill='%23fff' stroke='%23fff' stroke-width='0.9' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E" />
  <!-- Relative paths keep this working under a GitHub Pages subpath (/repo-name/) -->
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/content.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app" data-t="skip">Skip to presentation</a>

  <!-- Header: name, section menu and the switches. Each switch is a
       two-position slider. Each is a radio group, so it works
       with Tab + arrow keys and screen readers announce "1 of 2, selected". -->
  <header class="controls" aria-labelledby="controls-title">
    <h2 id="controls-title" class="sr-only" data-t="controlsTitle">Presentation settings</h2>

    <div class="bar">
      <a class="brand" href="#opening" data-index="0">AI-101</a>

      <!-- Section menu (filled in by js/nav.js): a row of links on larger
           screens, a dropdown on phones. The underline slides to the section
           you're reading. -->
      <nav class="sectionnav" id="sectionnav" aria-label="Sections">
        <div class="sectionnav__track">
          <ol class="sectionnav__list"></ol>
          <span class="sectionnav__indicator" aria-hidden="true"></span>
        </div>
        <div class="sectionnav__compact">
          <button class="sectionnav__button" type="button" aria-expanded="false" aria-controls="section-menu">
            <span class="sr-only"><span data-n="contents">Go to section</span>:</span>
            <span class="sectionnav__count">01</span>
            <span class="sectionnav__name">Start here</span>
            <svg class="sectionnav__chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="section-menu" id="section-menu" hidden>
            <ol></ol>
          </div>
        </div>
      </nav>

      <!-- Settings on the right. The labels ("Comparison", "Language") are
           read by screen readers but not shown: the options speak for themselves. -->
      <div class="controls__inner">

        <fieldset class="toggle">
          <legend class="toggle__legend sr-only" data-t="viewLegend">Comparison</legend>
          <div class="toggle__track" data-pos="0">
            <input type="radio" id="view-school" name="view" value="school" checked />
            <label for="view-school"><span data-t="viewSchool">School</span></label>
            <input type="radio" id="view-company" name="view" value="company" />
            <label for="view-company"><span data-t="viewCompany">Company</span></label>
            <span class="toggle__thumb" aria-hidden="true"></span>
          </div>
        </fieldset>

        <fieldset class="toggle">
          <legend class="toggle__legend sr-only" data-t="langLegend">Language</legend>
          <div class="toggle__track" data-pos="0">
            <input type="radio" id="lang-en" name="lang" value="en" checked />
            <label for="lang-en" lang="en">English</label>
            <input type="radio" id="lang-ko" name="lang" value="ko" />
            <label for="lang-ko" lang="ko">한국어</label>
            <span class="toggle__thumb" aria-hidden="true"></span>
          </div>
        </fieldset>

      </div>
    </div>

  </header>

  <!-- Announces the new version to screen readers after a change -->
  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

  <!-- The presentation is drawn here by js/main.js from js/content.js -->
  <main id="app" tabindex="-1">
    <noscript>
      <p class="noscript">This presentation needs JavaScript to show its content. · 이 발표 자료를 보려면 JavaScript가 필요합니다.</p>
    </noscript>
  </main>

  <footer class="footer">
    <p data-t="footer">A learning presentation. Not affiliated with Anthropic or OpenAI.</p>
  </footer>
</body>
</html>
